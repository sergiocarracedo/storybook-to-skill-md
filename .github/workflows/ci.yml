name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check CLI
        run: pnpm --filter "@sergiocarracedo/storybook-to-skills-md" typecheck

      - name: Lint CLI
        run: pnpm --filter "@sergiocarracedo/storybook-to-skills-md" lint

      - name: Check formatting CLI
        run: pnpm --filter "@sergiocarracedo/storybook-to-skills-md" fmt:check

      - name: Run tests CLI
        run: pnpm --filter "@sergiocarracedo/storybook-to-skills-md" test:run

      - name: Build CLI
        run: pnpm --filter "@sergiocarracedo/storybook-to-skills-md" build
      
      - name: Build web
        run: pnpm --filter web build
