name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: security  # Run after security scan passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check CLI
        run: pnpm --filter "storybook-to-skill-md" typecheck

      - name: Lint CLI
        run: pnpm --filter "storybook-to-skill-md" lint

      - name: Check formatting CLI
        run: pnpm --filter "storybook-to-skill-md" fmt:check

      - name: Run tests CLI
        run: pnpm --filter "storybook-to-skill-md" test:run

      - name: Build CLI
        run: pnpm --filter "storybook-to-skill-md" build
      
      - name: Build web
        run: pnpm --filter web build
