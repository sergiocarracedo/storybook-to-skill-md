name: Release

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          path: packages/cli
          merge: true
