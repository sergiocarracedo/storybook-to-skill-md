name: Release

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # id-token is forwarded to the publish job (needed for npm OIDC publishing)
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          path: packages/cli

  publish:
    name: Publish
    needs: release
    # Publish when release-please created a release, or when triggered manually
    if: ${{ needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
