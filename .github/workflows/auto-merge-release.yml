name: Auto-merge Release PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Release PRs
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    steps:
      - name: Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Check if PR is mergeable
            if (pr.mergeable === false) {
              console.log('PR is not mergeable');
              return;
            }
            
            // Check if PR has the autorelease: pending label
            const hasLabel = pr.labels.some(l => l.name === 'autorelease: pending');
            if (!hasLabel) {
              console.log('PR does not have autorelease: pending label');
              return;
            }
            
            // Try to merge the PR
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              console.log('PR merged successfully');
            } catch (error) {
              // If merge fails, it might be because it's already merged or needs other conditions
              console.log('Could not merge PR:', error.message);
            }
