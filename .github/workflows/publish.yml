name: Publish to npm

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Update npm for OIDC Trusted Publishing support (requires >=11.5.1)
        run: npm install -g npm@latest

      - name: Print npm version
        run: npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter "storybook-to-skills-md" build

      - name: Publish CLI to npm
        working-directory: packages/cli
        run: npm publish
        env:
          # Clear the GITHUB_TOKEN that setup-node injects via registry-url,
          # so npm uses OIDC Trusted Publishing instead.
          NODE_AUTH_TOKEN: ""
