name: Publish to npm

on:
  # Called directly from release.yml after release-please creates a release.
  # (A release created by GITHUB_TOKEN cannot trigger other workflows, so we
  # chain via workflow_call instead of relying on the 'release: published' event.)
  workflow_call:

  # Keep workflow_dispatch so it can be triggered manually from the GitHub UI
  # when needed (e.g. to re-publish after a failed run).
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter "storybook-to-skills-md" build

      - name: Publish CLI to npm
        # pnpm does not perform the npm OIDC token exchange required for
        # Trusted Publishing. Use `npm publish` directly so the npm CLI
        # handles the OIDC handshake. --provenance activates the flow.
        working-directory: packages/cli
        run: npm publish --access public --provenance
