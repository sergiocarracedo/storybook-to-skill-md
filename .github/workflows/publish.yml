name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Only publish if the release tag starts with 'v' (CLI releases)
    if: startsWith(github.event.release.tag_name, 'v')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter "storybook-to-skills-md" build

      - name: Publish CLI to npm
        # NOTE: Uses Trusted Publishing with provenance - no NODE_AUTH_TOKEN needed
        # The id-token: write permission above enables OIDC authentication
        run: pnpm --filter "storybook-to-skills-md" publish --no-git-checks --access public
