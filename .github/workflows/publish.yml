name: Publish to npm

on:
  # Called directly from release.yml after release-please creates a release.
  # (A release created by GITHUB_TOKEN cannot trigger other workflows, so we
  # chain via workflow_call instead of relying on the 'release: published' event.)
  workflow_call:

  # Allows manual re-publish from the GitHub Actions UI when needed.
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # required for npm OIDC Trusted Publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing requires Node >= 22.14.0 and npm >= 11.5.1
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Update npm to support Trusted Publishing
        # npm Trusted Publishing (OIDC, no token needed) requires npm >= 11.5.1
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter "storybook-to-skills-md" build

      - name: Publish CLI to npm
        # Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
        # npm CLI exchanges the GitHub Actions OIDC token for a temporary
        # publish token when id-token: write is granted and the package has
        # GitHub Actions configured as a Trusted Publisher on npmjs.com.
        working-directory: packages/cli
        run: npm publish --access public --provenance
