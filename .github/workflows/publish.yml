name: Publish to npm

on:
  # Called directly from release.yml after release-please creates a release.
  # (A release created by GITHUB_TOKEN cannot trigger other workflows, so we
  # chain via workflow_call instead of relying on the 'release: published' event.)
  workflow_call:

  # Keep workflow_dispatch so it can be triggered manually from the GitHub UI
  # when needed (e.g. to re-publish after a failed run).
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Do NOT set registry-url here: setup-node would create an .npmrc
          # that sets NODE_AUTH_TOKEN (GITHUB_TOKEN), which npm then uses
          # instead of the OIDC token exchange required for Trusted Publishing.
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter "storybook-to-skills-md" build

      - name: Publish CLI to npm
        # Uses npm Trusted Publishing (OIDC) — no NODE_AUTH_TOKEN needed.
        # npm CLI automatically exchanges the GitHub Actions OIDC token for a
        # temporary npm publish token when id-token: write is granted and the
        # package has GitHub Actions configured as a Trusted Publisher on npmjs.com.
        working-directory: packages/cli
        run: npm publish --registry https://registry.npmjs.org --access public --provenance
