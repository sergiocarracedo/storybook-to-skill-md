name: Publish to npm

on:
  # Called directly from release.yml after release-please creates a release.
  # (A release created by GITHUB_TOKEN cannot trigger other workflows, so we
  # chain via workflow_call instead of relying on the 'release: published' event.)
  workflow_call:

  # Allows manual re-publish from the GitHub Actions UI when needed.
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # required for npm provenance signing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter "storybook-to-skills-md" build

      - name: Publish CLI to npm
        working-directory: packages/cli
        run: npm publish --access public --provenance
        env:
          # Create a Granular Access Token on npmjs.com (Packages → Publish)
          # and store it as NPM_TOKEN in the repository secrets.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
